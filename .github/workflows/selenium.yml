
name: Python Selenium Automation

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  selenium-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Create directories
      - name: Create Reports and Screenshots
        run: |
          mkdir -p reports
          mkdir -p screenshots

      # Step 5: Execute Selenium Tests
      - name: Run Selenium Pytest
        run: |
          pytest -v -s \
          --html=reports/report.html \
          --self-contained-html

      # Step 6: Upload HTML Report
      - name: Upload Pytest HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-report
          path: reports/
          if-no-files-found: warn

      # Step 7: Upload Failure Screenshots
      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: screenshots/
          if-no-files-found: ignore