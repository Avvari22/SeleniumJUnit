
name: Selenium HTML Report Publishing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  selenium:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-html

      - name: Create Reports Directory
        run: |
          mkdir -p reports/site

      - name: Execute Selenium Tests
        id: tests
        continue-on-error: true
        run: |
          pytest testScripts/ -v -s \
            --html=reports/site/index.html \
            --self-contained-html

      - name: Verify HTML Report
        if: always()
        run: |
          echo "Checking HTML report..."
          ls -lah reports/site/
          test -s reports/site/index.html

      - name: Upload Downloadable HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-report
          path: reports/site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Keep the default artifact name: github-pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/site/

      # Deploy the artifact from this same job and run
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display Published Report URL
        if: success()
        run: |
          echo "## Selenium HTML Report" >> $GITHUB_STEP_SUMMARY
          echo "[View HTML Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY

      - name: Mark Test Failures
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
