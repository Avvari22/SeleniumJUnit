
name: Selenium Automation with HTML Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-html

      - name: Create Report Directory
        run: |
          mkdir -p reports/site
          mkdir -p screenshots

      - name: Run Selenium Tests
        id: tests
        continue-on-error: true
        run: |
          pytest -v -s testScripts/ \
            --html=reports/site/index.html \
            --self-contained-html

      - name: Verify HTML Report
        if: always()
        run: |
          ls -lah reports/site/
          test -s reports/site/index.html

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-report
          path: reports/site/
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/site/

      - name: Deploy HTML Report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preserve Test Failure Status
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Selenium tests failed. HTML report is published."
          exit 1
