
name: Selenium Automation HTML Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: selenium-pages
  cancel-in-progress: false

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-html

      - name: Create Report Directory
        run: |
          mkdir -p reports/site
          mkdir -p screenshots

      - name: Execute Selenium Tests
        id: tests
        continue-on-error: true
        run: |
          pytest -v -s testScripts/ \
            --html=reports/site/index.html \
            --self-contained-html

      - name: Verify HTML Report
        if: always()
        run: |
          if [ ! -s reports/site/index.html ]; then
            echo "HTML report was not generated"
            exit 1
          fi
          echo "HTML report generated successfully"

      # Downloadable report in Actions
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-report
          path: reports/site/
          if-no-files-found: error

      # Prepare GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # IMPORTANT: This creates the github-pages artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: reports/site/

      # Publish report
      - name: Deploy HTML Report
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      # Display public report URL in Actions summary
      - name: Publish Report Link
        if: success()
        run: |
          echo "## Selenium Automation HTML Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Open HTML Test Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY

      # Keep test failures visible
      - name: Report Test Status
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "Selenium tests failed. Review the published HTML report."
          exit 1
